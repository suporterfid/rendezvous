services:
  # Backend PHP 8.2 FPM
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rendezvous_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - IMAP_HOST=mailpit
      - IMAP_PORT=1110
    depends_on:
      - db
      - mailpit

  # Web Server Nginx
  web:
    image: nginx:alpine
    container_name: rendezvous_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - node

  # MySQL 8 Database (Production / Multi-tenant testing)
  db:
    image: mysql:8.0
    container_name: rendezvous_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rendezvous
      MYSQL_USER: rendezvous
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Mailpit - Test Double for SMTP & IMAP Mailbox Ingestion
  mailpit:
    image: axllent/mailpit:latest
    container_name: rendezvous_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
      - "1110:1110" # IMAP

  # Vite Frontend Dev Server (Node 20)
  node:
    image: node:20-alpine
    container_name: rendezvous_node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev -- --host 0.0.0.0; else tail -f /dev/null; fi"

volumes:
  mysql_data:
  node_modules:
